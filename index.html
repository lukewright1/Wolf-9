<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@700&display=swap" rel="stylesheet">
<title>Back 9 Wolf</title>
<link id="ati" rel="apple-touch-icon" href="">
<link id="fav" rel="icon" type="image/png" href="">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Back 9 Wolf">
<meta name="theme-color" content="#1354A0">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
input,button,select,textarea{font-family:inherit;font-weight:inherit;}
:root{
  --bg0:#fff;--bg1:#f0f0ee;--bg2:#e4e2de;
  --tx0:#111;--tx1:#555;--tx2:#909088;
  --bl:#1354A0;--bl2:#dceaf8;--gr:#2d5e0a;--gr2:#d4edba;
  --am:#7a3d00;--am2:#fde8b8;--am3:#d4860e;
  --rd:#8f1f1f;--rd2:#fad4d4;--rd3:#e06060;
  --bdr:rgba(0,0,0,0.15);--bdm:rgba(0,0,0,0.28);
  --r1:8px;--r2:12px;--r3:16px;
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme=light]){
    --bg0:#1c1c1a;--bg1:#272724;--bg2:#303030;
    --tx0:#f0ede8;--tx1:#9a9a96;--tx2:#66665e;
    --bl:#4a90d9;--bl2:#0d2a42;--gr:#8dc44a;--gr2:#182d06;
    --am:#f0c060;--am2:#2a1800;--am3:#c07a10;
    --rd:#e06060;--rd2:#2a0a0a;--rd3:#e06060;
    --bdr:rgba(255,255,255,0.1);--bdm:rgba(255,255,255,0.2);
  }
}
[data-theme=dark]{
  --bg0:#1c1c1a;--bg1:#272724;--bg2:#303030;
  --tx0:#f0ede8;--tx1:#9a9a96;--tx2:#66665e;
  --bl:#4a90d9;--bl2:#0d2a42;--gr:#8dc44a;--gr2:#182d06;
  --am:#f0c060;--am2:#2a1800;--am3:#c07a10;
  --rd:#e06060;--rd2:#2a0a0a;--rd3:#e06060;
  --bdr:rgba(255,255,255,0.1);--bdm:rgba(255,255,255,0.2);
}
[data-theme=light]{
  --bg0:#fff;--bg1:#f0f0ee;--bg2:#e4e2de;
  --tx0:#111;--tx1:#555;--tx2:#909088;
  --bl:#1354A0;--bl2:#dceaf8;--gr:#2d5e0a;--gr2:#d4edba;
  --am:#7a3d00;--am2:#fde8b8;--am3:#d4860e;
  --rd:#8f1f1f;--rd2:#fad4d4;--rd3:#e06060;
  --bdr:rgba(0,0,0,0.15);--bdm:rgba(0,0,0,0.28);
}
body{background:var(--bg1);font-family:'Lexend',sans-serif;font-weight:700;color:var(--tx0);min-height:100vh;}
.app-shell{max-width:430px;margin:0 auto;padding:0;}
.app{padding:0 0 40px;}
.app-body{padding:14px 14px 0;}
.header{text-align:center;position:relative;margin-bottom:18px;padding-top:8px;}
.header h1{font-size:26px;font-weight:700;letter-spacing:-0.5px;margin:0 0 6px;}
.app-header{background:linear-gradient(180deg,#1354A0 0%,#0d3d7a 100%);padding:16px 16px 26px;}
[data-theme=dark] .app-header{background:linear-gradient(180deg,#0d2a42 0%,#081a2a 100%);}
.app-header-top{display:flex;align-items:flex-start;justify-content:space-between;}
.app-header-logo{font-size:32px;line-height:1;}
.app-header-title{font-size:22px;font-weight:700;color:#fff;letter-spacing:-0.5px;margin-top:2px;}
.app-header-course{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,0.15);border-radius:20px;padding:4px 11px;margin-top:6px;}
.app-header-course span{font-size:12px;font-weight:700;color:rgba(255,255,255,0.92);}
.app-header-actions{display:flex;flex-direction:column;gap:6px;align-items:flex-end;}
.app-hdr-btn{background:rgba(255,255,255,0.15);border:none;color:rgba(255,255,255,0.9);font-size:12px;font-weight:700;padding:5px 11px;border-radius:20px;cursor:pointer;font-family:inherit;}
.app-hdr-btn.danger{color:rgba(255,140,140,0.95);}
.app-content{background:var(--bg1);border-radius:20px 20px 0 0;margin-top:-12px;padding:14px 14px 0;}
.card{background:var(--bg0);border-radius:var(--r3);padding:14px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,0.07);}
.card-flush{background:var(--bg0);border-radius:var(--r3);overflow:hidden;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,0.07);}
[data-theme=dark] .card,[data-theme=dark] .card-flush{box-shadow:none;border:0.5px solid var(--bdr);}
.section-title{font-size:11px;font-weight:700;color:var(--tx2);text-transform:uppercase;letter-spacing:0.7px;margin:0 0 8px;}
.btn-primary{width:100%;height:50px;background:var(--bl);color:#fff;border:none;border-radius:var(--r3);font-size:17px;font-weight:700;cursor:pointer;margin-top:12px;box-shadow:0 4px 12px rgba(19,84,160,0.25);}
.btn-confirm{width:100%;height:50px;background:var(--bl);color:#fff;border:none;border-radius:var(--r3);font-size:17px;font-weight:700;cursor:pointer;margin-bottom:12px;box-shadow:0 4px 12px rgba(19,84,160,0.25);}
.btn-confirm:disabled{background:var(--bg2);color:var(--tx2);box-shadow:none;}
.btn-back{background:none;border:none;color:var(--bl);font-size:14px;cursor:pointer;padding:0;font-weight:700;}
.hole-nav-hdr{background:linear-gradient(180deg,#1354A0 0%,#0d3d7a 100%);padding:14px 14px 24px;}
[data-theme=dark] .hole-nav-hdr{background:linear-gradient(180deg,#0d2a42 0%,#081a2a 100%);}
.hole-nav{display:flex;align-items:center;justify-content:space-between;}
.hole-title{text-align:center;flex:1;}
.hole-title h2{font-size:24px;font-weight:700;color:#fff;}
.hole-title p{font-size:12px;color:rgba(255,255,255,0.65);margin-top:2px;}
.btn-nav{width:38px;height:38px;background:rgba(255,255,255,0.15);border:none;border-radius:10px;font-size:18px;cursor:pointer;color:#fff;display:flex;align-items:center;justify-content:center;}
.btn-nav:disabled{opacity:0.3;}
.wolf-pill{display:flex;align-items:center;gap:10px;background:var(--bg0);border-radius:var(--r3);padding:10px 14px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,0.07);}
[data-theme=dark] .wolf-pill{box-shadow:none;border:0.5px solid var(--bdr);}
.wolf-pill-info{flex:1;}
.wolf-pill-label{font-size:11px;color:var(--tx2);font-weight:700;}
.wolf-pill-name{font-size:16px;font-weight:700;color:var(--tx0);}
.wolf-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.wolf-badge{background:var(--bl);color:#fff;border-radius:20px;padding:6px 14px;font-size:14px;font-weight:700;}
.btn-mulligan{background:transparent;border:1.5px solid var(--am3);color:var(--am3);border-radius:20px;padding:5px 12px;font-size:13px;font-weight:700;cursor:pointer;}
.btn-mulligan.used{background:var(--am2);color:var(--am);border-color:var(--am);}
.mode-pills{display:flex;gap:0;margin-bottom:14px;background:var(--bg2);border-radius:12px;padding:3px;}
.mode-pill{flex:1;height:36px;border:none;border-radius:10px;background:transparent;color:var(--tx1);font-size:13px;font-weight:700;cursor:pointer;}
.mode-pill.active{background:var(--bg0);color:var(--tx0);box-shadow:0 1px 4px rgba(0,0,0,0.1);}
.partner-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;}
.btn-partner{height:44px;background:var(--bg0);border:1.5px solid var(--bdr);border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;color:var(--tx0);}
.btn-partner.selected{background:var(--bl2);border-color:var(--bl);color:var(--bl);}
.prelim-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.prelim-row:last-child{margin-bottom:0;}
.score-input{width:54px;height:40px;text-align:center;font-size:18px;font-weight:700;border:0.5px solid var(--bdm);border-radius:var(--r1);background:var(--bg1);color:var(--tx0);outline:none;-webkit-appearance:none;}
.score-input:focus{border-color:var(--bl);}
.prelim-score-input{width:64px;height:56px;font-size:26px;border-width:1.5px;border-radius:10px;}
.player-input-wrap{flex:1;position:relative;}
.player-input{width:100%;height:40px;padding:0 30px 0 12px;font-size:15px;font-weight:700;border:0.5px solid var(--bdm);border-radius:var(--r1);background:var(--bg1);color:var(--tx0);outline:none;-webkit-appearance:none;}
.player-input:focus{border-color:var(--bl);}
.dd-arrow{position:absolute;right:0;top:0;bottom:0;width:36px;display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--tx2);cursor:pointer;}
.dropdown{position:absolute;top:44px;left:0;right:0;background:var(--bg0);border:0.5px solid var(--bdm);border-radius:var(--r2);z-index:100;box-shadow:0 4px 16px rgba(0,0,0,0.12);overflow:hidden;}
.dd-item{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:0.5px solid var(--bdr);font-size:14px;font-weight:700;cursor:pointer;}
.dd-item:last-child{border-bottom:none;}
.dd-del{background:rgba(224,96,96,0.12);border:none;color:var(--rd3);font-size:14px;cursor:pointer;padding:0;font-weight:700;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
.player-row{display:flex;align-items:center;gap:8px;padding:8px 0;}
.player-row-wrap{position:relative;overflow:hidden;border-radius:var(--r2);margin-bottom:10px;}
.player-row-wrap:last-of-type{margin-bottom:0;}
.delete-reveal{position:absolute;right:0;top:0;bottom:0;width:80px;background:var(--rd);display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:700;border-radius:0 var(--r2) var(--r2) 0;}
.player-row-inner{transition:transform 0.2s ease;background:var(--bg0);border-radius:var(--r2);display:flex;align-items:center;gap:8px;padding:8px 0;}
.player-row-inner.swiped{transform:translateX(-80px);}
.role-tag{font-size:10px;padding:2px 6px;border-radius:10px;flex-shrink:0;font-weight:700;}
.role-wolf{background:var(--bl);color:#fff;}
.role-cowolf{background:var(--bl2);color:var(--bl);}
.par-tag{font-size:10px;padding:2px 6px;border-radius:10px;background:var(--bg1);color:var(--tx1);border:0.5px solid var(--bdr);}
.birdie-tag{font-size:10px;padding:2px 6px;border-radius:10px;background:var(--gr2);color:var(--gr);border:0.5px solid var(--gr);}
.eagle-tag{font-size:10px;padding:2px 6px;border-radius:10px;background:#e8f5e9;color:#1b5e20;border:0.5px solid #1b5e20;}
.bogey-tag{font-size:10px;padding:2px 6px;border-radius:10px;background:var(--am2);color:var(--am);border:0.5px solid var(--am);}
.double-tag{font-size:10px;padding:2px 6px;border-radius:10px;background:var(--rd2);color:var(--rd);border:0.5px solid var(--rd3);}
.tab-bar{display:flex;background:var(--bg2);border-radius:12px;padding:3px;margin-bottom:14px;gap:2px;}
.tab-btn{flex:1;height:36px;border:none;border-radius:9px;background:transparent;color:var(--tx1);font-size:13px;font-weight:700;cursor:pointer;}
.tab-btn.active{background:var(--bg0);color:var(--tx0);box-shadow:0 1px 4px rgba(0,0,0,0.1);}
.sb-table{width:100%;border-collapse:collapse;font-size:13px;}
.sb-table th{font-size:11px;font-weight:700;color:var(--tx2);text-transform:uppercase;padding:8px 12px;text-align:left;border-bottom:0.5px solid var(--bdr);}
.sb-table td{padding:10px 12px;border-bottom:0.5px solid var(--bdr);}
.sb-table tr:last-child td{border-bottom:none;}
.sb-pts{text-align:right;font-size:16px;font-weight:700;color:var(--bl);}
.history-row{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:0.5px solid var(--bdr);cursor:pointer;}
.history-row:last-child{border-bottom:none;}
.round-row{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:0.5px solid var(--bdr);cursor:pointer;}
.round-row:last-child{border-bottom:none;}
.final-block{background:var(--gr);color:#fff;border-radius:var(--r3);padding:20px;text-align:center;margin-bottom:14px;}
.final-block h2{font-size:22px;font-weight:700;margin-bottom:4px;}
.info-box{background:var(--am2);border:0.5px solid var(--am3);border-radius:var(--r2);padding:12px 14px;margin-bottom:12px;font-size:13px;color:var(--am);}
</style>
</head>
<body>
<div class="app-shell"><div class="app" id="app"></div></div>
<script>
var PARS={10:4,11:3,12:4,13:4,14:5,15:3,16:4,17:4,18:5};
var FIRST_HOLE=10,LAST_HOLE=18;
function startGPS(cb){
  if(!navigator.geolocation){cb(null,'GPS not supported');return;}
  if(_gpsPos){cb(_gpsPos,null);return;}
  navigator.geolocation.getCurrentPosition(
    function(pos){_gpsPos={lat:pos.coords.latitude,lng:pos.coords.longitude};cb(_gpsPos,null);},
    function(err){cb(null,err.message||'GPS unavailable');},
    {enableHighAccuracy:true,timeout:8000,maximumAge:10000}
  );
}


function syncCourse(){
  if(S&&S.course&&S.course.pars){
    var nine=S.course.nine||'back';
    var allPars=S.course.pars;
    var allHoles=Object.keys(allPars).map(Number).sort(function(a,b){return a-b;});
    if(nine==='front'){
      var frontHoles=allHoles.filter(function(h){return h<=9;});
      if(!frontHoles.length)frontHoles=allHoles.slice(0,9);
      FIRST_HOLE=frontHoles[0];LAST_HOLE=frontHoles[frontHoles.length-1];
    } else if(nine==='back'){
      var backHoles=allHoles.filter(function(h){return h>=10;});
      if(!backHoles.length)backHoles=allHoles.slice(9);
      FIRST_HOLE=backHoles[0];LAST_HOLE=backHoles[backHoles.length-1];
    } else {
      FIRST_HOLE=allHoles[0];LAST_HOLE=allHoles[allHoles.length-1];
    }
    PARS={};allHoles.forEach(function(h){PARS[h]=allPars[h];});
  }
}
var PCOLS=['#1354A0','#2d5e0a','#8f1f1f','#7a3d00','#2e2880'];
var PLCOLS=['#dceaf8','#d4edba','#fad4d4','#fde8b8','#e8e6fe'];
var PTCOLS=['#0a3570','#1a4a06','#5a1010','#4a2500','#1e1860'];

function applyTheme(t){
  document.documentElement.setAttribute('data-theme',t);
  try{localStorage.setItem('wolf_theme',t);}catch(e){}
}
(function(){
  try{var t=localStorage.getItem('wolf_theme');if(t)applyTheme(t);}catch(e){}
})();

function parLabel(score,h){
  var par=PARS[h];
  if(!score||!par)return null;
  var d=score-par;
  if(d<=-2)return{text:'Eagle!',cls:'eagle-tag'};
  if(d===-1)return{text:'Birdie!',cls:'birdie-tag'};
  if(d===0)return{text:'Par',cls:'par-tag'};
  if(d===1)return{text:'Bogey',cls:'bogey-tag'};
  if(d===2)return{text:'Double',cls:'double-tag'};
  return{text:'+'+d,cls:'double-tag'};
}
function isBirdie(s,h){return s>0&&PARS[h]>0&&s<=PARS[h]-1;}

function loadRoster(){try{return JSON.parse(localStorage.getItem('wolf_roster')||'[]');}catch(e){return[];}}
function saveRoster(r){try{localStorage.setItem('wolf_roster',JSON.stringify(r));}catch(e){}}
var roster=loadRoster();
function addToRoster(n){n=n.trim();if(!n||roster.indexOf(n)>=0)return;roster.push(n);saveRoster(roster);}
function removeFromRoster(n){roster=roster.filter(function(r){return r!==n;});saveRoster(roster);}

function loadProfiles(){try{return JSON.parse(localStorage.getItem('wolf_profiles')||'{}');}catch(e){return {};}}
function saveProfiles(){
  var profiles={};
  S.players.forEach(function(p){
    if(p.name.trim()){profiles[p.name.trim()]={color:p.color,photo:p.photo};}
  });
  try{localStorage.setItem('wolf_profiles',JSON.stringify(profiles));}catch(e){}
}
function savePlayerPhone(name,phone){
  var profiles=loadProfiles();
  if(profiles[name])profiles[name].phone=phone;
  else profiles[name]={phone:phone};
  try{localStorage.setItem('wolf_profiles',JSON.stringify(profiles));}catch(e){}
}
function saveLogo(logo){try{if(logo)localStorage.setItem('wolf_logo',logo);else localStorage.removeItem('wolf_logo');}catch(e){}}
function loadLogo(){try{return localStorage.getItem('wolf_logo')||null;}catch(e){return null;}}

function loadRounds(){try{return JSON.parse(localStorage.getItem('wolf_rounds')||'[]');}catch(e){return[];}}
function saveRound(rd){
  var rounds=loadRounds();
  rounds.unshift(rd);
  if(rounds.length>20)rounds.length=20;
  try{localStorage.setItem('wolf_rounds',JSON.stringify(rounds));}catch(e){}
}
function deleteRound(idx){
  var rounds=loadRounds();rounds.splice(idx,1);
  try{localStorage.setItem('wolf_rounds',JSON.stringify(rounds));}catch(e){}
}

function saveState(){try{localStorage.setItem('wolf_current',JSON.stringify(S));}catch(e){}}
function loadState(){try{var r=localStorage.getItem('wolf_current');return r?JSON.parse(r):null;}catch(e){return null;}}
function clearState(){try{localStorage.removeItem('wolf_current');}catch(e){}}

var _saved=loadState();
if(_saved&&_saved.players){
  _saved.players.forEach(function(p){p.id=String(p.id);});
  if(_saved.wolfOrder)_saved.wolfOrder=_saved.wolfOrder.map(function(id){return String(id);});
}
var S=_saved||{
  screen:'setup',
  players:[
    {name:'',id:'0',color:PCOLS[0],photo:null,phone:''},
    {name:'',id:'1',color:PCOLS[1],photo:null,phone:''},
    {name:'',id:'2',color:PCOLS[2],photo:null,phone:''},
    {name:'',id:'3',color:PCOLS[3],photo:null,phone:''}
  ],
  prelimScores:{},prelimHoled:{},wolfOrder:[],
  currentHole:FIRST_HOLE,holes:{},mulliganUsed:{},customLogo:null,course:{name:'Los Lagos',city:'Costa Mesa, CA',pars:{1:5,2:3,3:4,4:4,5:4,6:3,7:5,8:4,9:4,10:4,11:3,12:4,13:4,14:5,15:3,16:4,17:4,18:5},nine:'back'}
};
S.customLogo=loadLogo()||S.customLogo||null;
if(!S.course)S.course={name:'Los Lagos',city:'Costa Mesa, CA',pars:{1:5,2:3,3:4,4:4,5:4,6:3,7:5,8:4,9:4,10:4,11:3,12:4,13:4,14:5,15:3,16:4,17:4,18:5},nine:'back'};
syncCourse();

function sid(id){return String(id);}
function wolfFor(h){
  if(h<=FIRST_HOLE)return null;
  var is5=S.players.length===5;
  var gameHole=h-FIRST_HOLE; // 1-indexed game hole (hole 11 = gameHole 1)

  if(is5){
    // 5-player Wolf rules:
    // Game holes 1-5: strict rotation — each player wolves exactly once in prelim order
    // Game holes 6+: merit-based — best scorer on prior hole is Wolf
    if(gameHole<=5){
      // Strict rotation — use prelim order index directly
      var id=S.wolfOrder[(gameHole-1)%S.wolfOrder.length];
      return id!=null?sid(id):null;
    } else {
      // Merit-based: best scorer on prior hole becomes Wolf
      var prevHole=h-1;
      var prevData=S.holes[prevHole];
      if(prevData&&prevData.scores){
        var scores=prevData.scores;
        var best=null;var bestScore=99;
        S.wolfOrder.forEach(function(pid){
          var sc=scores[sid(pid)];
          if(sc&&sc>0&&sc<bestScore){bestScore=sc;best=pid;}
        });
        if(best!=null)return sid(best);
      }
      // Fallback to rotation if prior hole not yet scored
      var id2=S.wolfOrder[(gameHole-1)%S.wolfOrder.length];
      return id2!=null?sid(id2):null;
    }
  } else {
    // 4-player: always merit-based after prelim
    var prevHole2=h-1;
    var prevData2=S.holes[prevHole2];
    if(prevData2&&prevData2.scores){
      var scores2=prevData2.scores;
      var best2=null;var bestScore2=99;
      S.wolfOrder.forEach(function(pid){
        var sc=scores2[sid(pid)];
        if(sc&&sc>0&&sc<bestScore2){bestScore2=sc;best2=pid;}
      });
      if(best2!=null)return sid(best2);
    }
    // Fallback to rotation
    var id3=S.wolfOrder[(gameHole-1)%S.wolfOrder.length];
    return id3!=null?sid(id3):null;
  }
}
function pById(id){return S.players.filter(function(p){return sid(p.id)===sid(id);})[0]||null;}
function pIdx(id){for(var i=0;i<S.players.length;i++)if(sid(S.players[i].id)===sid(id))return i;return 0;}

function mkAv(name,i,size){
  var el=document.createElement('div');
  var p=S.players[i];
  el.style.cssText='width:'+size+'px;height:'+size+'px;border-radius:50%;flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:'+(size*0.42)+'px;font-weight:700;color:#fff;background:'+(p&&p.color?p.color:PCOLS[i%PCOLS.length])+';';
  if(p&&p.photo){

  } else {

  }
  return el;
}

function calcWinner(holeNum){
  var hole=S.holes[holeNum];
  if(!hole||!hole.mode)return null;
  var rawScores=hole.scores||{};
  var scores={};
  Object.keys(rawScores).forEach(function(k){scores[sid(k)]=rawScores[k];});
  var allScored=S.players.every(function(p){return (scores[sid(p.id)]||0)>0;});
  if(!allScored)return null;
  var wId=wolfFor(holeNum);
  if(hole.mode==='partner'&&hole.partner){
    var wolfBest=Math.min(scores[sid(wId)]||99,scores[sid(hole.partner)]||99);
    var otherPlayers=S.players.filter(function(p){return sid(p.id)!==sid(wId)&&sid(p.id)!==sid(hole.partner);});
    var otherBest=Math.min.apply(null,otherPlayers.map(function(p){return scores[sid(p.id)]||99;}));
    return wolfBest<otherBest?'wolf_team':otherBest<wolfBest?'others':'tie';
  }
  if(hole.mode==='lone'||hole.mode==='forced'){
    var wolfScore=scores[sid(wId)]||99;
    var others=S.players.filter(function(p){return sid(p.id)!==sid(wId);});
    var ob=Math.min.apply(null,others.map(function(p){return scores[sid(p.id)]||99;}));
    return wolfScore<ob?'wolf':ob<wolfScore?'others':'tie';
  }
  return null;
}

function recalcHoleResult(holeNum){
  var hole=S.holes[holeNum];
  if(!hole||!hole.mode)return;
  if(hole.manualOverride){
    var hash=JSON.stringify(hole.scores||{});
    if(hash===hole.overrideScoreHash)return;
    S.holes[holeNum].manualOverride=false;
    S.holes[holeNum].overrideScoreHash=null;
  }
  var w=calcWinner(holeNum);
  if(w!==null)S.holes[holeNum].winner=w;
}

function derivePoints(){
  var pts={};var birdies={};
  S.players.forEach(function(p){pts[p.id]=0;birdies[p.id]=false;});
  for(var h=FIRST_HOLE+1;h<=LAST_HOLE;h++){
    var hole=S.holes[h];
    if(!hole||!hole.confirmed)continue;
    var wId=wolfFor(h);
    if(hole.winner==='wolf_team'&&hole.mode==='partner'){
      S.players.forEach(function(p){if(sid(p.id)===sid(wId)||sid(p.id)===sid(hole.partner))pts[p.id]=(pts[p.id]||0)+1;});
    } else if(hole.winner==='wolf'&&(hole.mode==='lone'||hole.mode==='forced')){
      S.players.forEach(function(p){if(sid(p.id)===sid(wId))pts[p.id]=(pts[p.id]||0)+3;});
    } else if(hole.winner==='others'&&hole.mode==='partner'){
      S.players.forEach(function(p){if(sid(p.id)!==sid(wId)&&sid(p.id)!==sid(hole.partner))pts[p.id]=(pts[p.id]||0)+1;});
    } else if(hole.winner==='others'&&(hole.mode==='lone'||hole.mode==='forced')){
      S.players.forEach(function(p){if(sid(p.id)!==sid(wId))pts[p.id]=(pts[p.id]||0)+1;});
    }
    if(h<LAST_HOLE&&hole.scores){
      S.players.forEach(function(p){if(isBirdie((hole.scores||{})[p.id],h))birdies[p.id]=true;});
    }
  }
  if(S.holes[FIRST_HOLE]&&S.holes[FIRST_HOLE].scores){
    S.players.forEach(function(p){if(isBirdie((S.holes[FIRST_HOLE].scores||{})[p.id],FIRST_HOLE))birdies[p.id]=true;});
  }
  return{pts:pts,birdies:birdies};
}

function deriveForcedWolf(){
  var done={};
  S.players.forEach(function(p){done[p.id]=false;});
  for(var h=FIRST_HOLE+1;h<=LAST_HOLE;h++){
    var hole=S.holes[h];
    if(!hole||!hole.confirmed)continue;
    if(hole.mode==='forced'||hole.mode==='lone'){var wId=wolfFor(h);done[wId]=true;}
  }
  return done;
}

function mustBeForced(holeNum){
  if(S.players.length!==4)return false;
  var wId=wolfFor(holeNum);if(!wId)return false;
  var wolfHoles=[];
  for(var h=FIRST_HOLE+1;h<=LAST_HOLE;h++)if(wolfFor(h)===wId)wolfHoles.push(h);
  if(wolfHoles.indexOf(holeNum)!==1)return false;
  var first=wolfHoles[0];
  var fh=S.holes[first];
  var wentLone=fh&&(fh.mode==='lone'||fh.mode==='forced');
  return !wentLone;
}

function playerHoleResultFor(pid,holeNum){
  var hNow=S.holes[holeNum]||{};
  if(!hNow.winner)return null;
  var wId=wolfFor(holeNum);
  var isWT=sid(pid)===sid(wId)||(hNow.mode==='partner'&&sid(pid)===sid(hNow.partner));
  if(hNow.winner==='tie')return{text:'Tie',cls:'tie'};
  if(hNow.mode==='partner'){
    if(hNow.winner==='wolf_team')return isWT?{text:'Win',cls:'win'}:{text:'Loss',cls:'loss'};
    if(hNow.winner==='others')return isWT?{text:'Loss',cls:'loss'}:{text:'Win',cls:'win'};
  }
  if(hNow.mode==='lone'||hNow.mode==='forced'){
    if(hNow.winner==='wolf')return sid(pid)===sid(wId)?{text:'Win +3',cls:'win'}:{text:'Loss',cls:'loss'};
    if(hNow.winner==='others')return sid(pid)===sid(wId)?{text:'Loss',cls:'loss'}:{text:'Win',cls:'win'};
  }
  return null;
}

  function doCourseLookup(){
    var q=crsInp.value.trim();if(!q)return;
    var ql=q.toLowerCase();
    crsResults.innerHTML='';crsStatus.textContent='';

    // 1. Local fuzzy search first (instant)
    var tokens=ql.split(/\s+/).filter(Boolean);
    var localScored=COURSE_DB.map(function(crs){
      var haystack=(crs.name+' '+crs.city).toLowerCase();
      var score=0;
      if(haystack.indexOf(ql)>=0)score+=100;
      tokens.forEach(function(tok){
        if(haystack.indexOf(tok)>=0)score+=20;
        if(tok.length>=3){
          haystack.split(/\s+/).forEach(function(w){if(w.indexOf(tok)===0)score+=10;});
        }
      });
      return{crs:crs,score:score};
    }).filter(function(x){return x.score>0;})
      .sort(function(a,b){return b.score-a.score;})
      .slice(0,4).map(function(x){return x.crs;});

    if(localScored.length){
      crsStatus.textContent='Built-in results — also searching live data...';
      localScored.forEach(function(crs){renderCourseItem(crs,crsResults);});
    } else {
      crsStatus.textContent='Searching live course database...';
    }

    // 2. Live search via golfcourseapi.com (free, CORS-enabled)
    var apiUrl='https://api.golfcourseapi.com/v1/search?search_query='+encodeURIComponent(q)+'&limit=10';
    fetch(apiUrl,{
      headers:{
        'Authorization':'Key 6BWLK6IDTZHMMUT2S4USCGIBXM',
        'x-api-key':'6BWLK6IDTZHMMUT2S4USCGIBXM'
      }
    })
      .then(function(res){
        if(!res.ok)throw new Error('HTTP '+res.status);
        return res.json();
      })
      .then(function(data){
        var courses=data.courses||data.data||data.results||[];
        if(!courses.length){
          if(!localScored.length)crsStatus.textContent='No results found. Try a different search.';
          else crsStatus.textContent=localScored.length+' local result'+(localScored.length!==1?'s':'')+' found';
          return;
        }
        // Clear and show combined results — live results first, then local
        crsResults.innerHTML='';
        var liveConverted=[];
        courses.forEach(function(c2){
          var holes=c2.holes||[];
          if(holes.length<9)return;
          var pars={};
          holes.forEach(function(h){if(h.number&&h.par)pars[h.number]=parseInt(h.par);});
          if(Object.keys(pars).length<9)return;
          var city=(c2.location&&c2.location.city?c2.location.city:'')+(c2.location&&c2.location.state?', '+c2.location.state:'');
          liveConverted.push({name:c2.course_name||c2.name,city:city,pars:pars,live:true});
        });
        // Deduplicate against local results
        var localNames=localScored.map(function(c2){return c2.name.toLowerCase();});
        var deduped=liveConverted.filter(function(c2){
          return !localNames.some(function(n){return n.indexOf(c2.name.toLowerCase().slice(0,10))>=0;});
        });
        var all=deduped.concat(localScored);
        all.forEach(function(crs){renderCourseItem(crs,crsResults);});
        crsStatus.textContent=all.length+' course'+(all.length!==1?'s':'')+' found'+(deduped.length?' ('+deduped.length+' live)':'');
      })
      .catch(function(err){
        if(localScored.length){
          crsStatus.textContent=localScored.length+' local result'+(localScored.length!==1?'s':'')+' (live search unavailable)';
        } else {
          crsStatus.textContent='No results found in local database. Live search unavailable: '+String(err);
        }
      });
  }

  crsSearchBtn.onclick=doCourseLookup;
  crsInp.addEventListener('keydown',function(e){if(e.key==='Enter')doCourseLookup();});
  crsInp.addEventListener('input',function(){if(crsInp.value.trim().length>=3)doCourseLookup();});
  app.appendChild(crsCard);

  var startBtn=document.createElement('button');startBtn.className='btn-primary';startBtn.id='start-btn';startBtn.textContent='Start game';
  startBtn.disabled=!S.players.every(function(p){return p.name.trim().length>0;});

    S.players.forEach(function(p){addToRoster(p.name);});
    saveProfiles();

    S.players.forEach(function(p){S.mulliganUsed[p.id]=false;});
    S.screen='prelim';S.prelimScores={};S.prelimHoled={};render();
  };
  app.appendChild(startBtn);
  document.addEventListener('click',function(e){if(!e.target.closest('.player-input-wrap'))closeDropdowns();});
}

function showCropModal(src,onSave){
  // Full-screen crop overlay
  var overlay=document.createElement('div');
  overlay.style.cssText='position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.92);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;';

  var title=document.createElement('p');
  title.style.cssText='color:#fff;font-family:inherit;font-weight:700;font-size:16px;margin-bottom:12px;';
  title.textContent='Drag to position · Pinch or scroll to zoom';
  overlay.appendChild(title);

  // Crop circle preview container
  var cropSize=280;
  var viewWrap=document.createElement('div');
  viewWrap.style.cssText='position:relative;width:'+cropSize+'px;height:'+cropSize+'px;border-radius:50%;overflow:hidden;border:3px solid #fff;cursor:grab;flex-shrink:0;';

  var img=new Image();
  img.onload=function(){
    var scale=Math.max(cropSize/img.width,cropSize/img.height);
    var iw=img.width*scale;var ih=img.height*scale;
    var ix=(cropSize-iw)/2;var iy=(cropSize-ih)/2;
    var state={x:ix,y:iy,w:iw,h:ih,scale:scale,minScale:scale,dragging:false,lastX:0,lastY:0};

    var canvas=document.createElement('canvas');
    canvas.width=cropSize;canvas.height=cropSize;
    canvas.style.cssText='display:block;width:'+cropSize+'px;height:'+cropSize+'px;';

    function draw(){
      var ctx=canvas.getContext('2d');
      ctx.clearRect(0,0,cropSize,cropSize);
      ctx.drawImage(img,state.x,state.y,state.w,state.h);
    }
    draw();
    viewWrap.appendChild(canvas);

    // Mouse/touch drag
    function clamp(){
      if(state.x>0)state.x=0;
      if(state.y>0)state.y=0;
      if(state.x+state.w<cropSize)state.x=cropSize-state.w;
      if(state.y+state.h<cropSize)state.y=cropSize-state.h;
    }

    canvas.addEventListener('mousedown',function(e){state.dragging=true;state.lastX=e.clientX;state.lastY=e.clientY;viewWrap.style.cursor='grabbing';});
    document.addEventListener('mousemove',function(e){
      if(!state.dragging)return;
      state.x+=e.clientX-state.lastX;state.y+=e.clientY-state.lastY;
      state.lastX=e.clientX;state.lastY=e.clientY;clamp();draw();
    });
    document.addEventListener('mouseup',function(){state.dragging=false;viewWrap.style.cursor='grab';});

    // Touch drag
    var lastTouch=null;var lastDist=null;
    canvas.addEventListener('touchstart',function(e){
      e.preventDefault();
      if(e.touches.length===1){lastTouch={x:e.touches[0].clientX,y:e.touches[0].clientY};}
      if(e.touches.length===2){
        var dx=e.touches[0].clientX-e.touches[1].clientX;
        var dy=e.touches[0].clientY-e.touches[1].clientY;
        lastDist=Math.sqrt(dx*dx+dy*dy);
      }
    },{passive:false});
    canvas.addEventListener('touchmove',function(e){
      e.preventDefault();
      if(e.touches.length===1&&lastTouch){
        var dx=e.touches[0].clientX-lastTouch.x;var dy=e.touches[0].clientY-lastTouch.y;
        state.x+=dx;state.y+=dy;lastTouch={x:e.touches[0].clientX,y:e.touches[0].clientY};clamp();draw();
      }
      if(e.touches.length===2&&lastDist){
        var dx2=e.touches[0].clientX-e.touches[1].clientX;
        var dy2=e.touches[0].clientY-e.touches[1].clientY;
        var dist=Math.sqrt(dx2*dx2+dy2*dy2);
        var ratio=dist/lastDist;
        var newScale=state.scale*ratio;
        if(newScale<state.minScale)newScale=state.minScale;
        if(newScale>state.minScale*4)newScale=state.minScale*4;
        var cx=cropSize/2;var cy=cropSize/2;
        state.x=cx-(cx-state.x)*(newScale/state.scale);
        state.y=cy-(cy-state.y)*(newScale/state.scale);
        state.w=img.width*newScale;state.h=img.height*newScale;
        state.scale=newScale;
        lastDist=dist;clamp();draw();
      }
    },{passive:false});
    canvas.addEventListener('touchend',function(){lastTouch=null;lastDist=null;});

    // Scroll to zoom on desktop
    canvas.addEventListener('wheel',function(e){
      e.preventDefault();
      var delta=e.deltaY>0?0.9:1.1;
      var newScale=state.scale*delta;
      if(newScale<state.minScale)newScale=state.minScale;
      if(newScale>state.minScale*4)newScale=state.minScale*4;
      var cx=cropSize/2;var cy=cropSize/2;
      state.x=cx-(cx-state.x)*(newScale/state.scale);
      state.y=cy-(cy-state.y)*(newScale/state.scale);
      state.w=img.width*newScale;state.h=img.height*newScale;
      state.scale=newScale;clamp();draw();
    },{passive:false});

    // Buttons
    var btnRow=document.createElement('div');
    btnRow.style.cssText='display:flex;gap:12px;margin-top:20px;';

    var cancelBtn=document.createElement('button');
    cancelBtn.style.cssText='height:48px;padding:0 28px;border-radius:24px;border:1.5px solid rgba(255,255,255,0.4);background:transparent;color:#fff;font-family:inherit;font-weight:700;font-size:16px;cursor:pointer;';
    cancelBtn.textContent='Cancel';
    cancelBtn.onclick=function(){document.body.removeChild(overlay);};

    var saveBtn=document.createElement('button');
    saveBtn.style.cssText='height:48px;padding:0 28px;border-radius:24px;border:none;background:#2d5e0a;color:#fff;font-family:inherit;font-weight:700;font-size:16px;cursor:pointer;';
    saveBtn.textContent='Use photo';
    saveBtn.onclick=function(){
      // Render final 200x200 crop to a new canvas
      var out=document.createElement('canvas');out.width=200;out.height=200;
      var octx=out.getContext('2d');
      var sc=200/cropSize;
      octx.drawImage(img,state.x*sc,state.y*sc,state.w*sc,state.h*sc);
      // Clip to circle for output
      document.body.removeChild(overlay);
      onSave(out.toDataURL('image/jpeg',0.85));
    };

    btnRow.appendChild(cancelBtn);btnRow.appendChild(saveBtn);
    overlay.appendChild(viewWrap);overlay.appendChild(btnRow);
  };
  img.src=src;
  document.body.appendChild(overlay);
}

    row.appendChild(mkAv(p.name,i,34));
    var ns=document.createElement('span');ns.style.cssText='flex:1;font-size:16px;font-weight:700;';ns.textContent=p.name;
    var scv=S.prelimScores[p.id]||0;
    var inp=document.createElement('input');inp.className='score-input prelim-score-input';inp.type='number';inp.min=1;inp.max=15;
    inp.inputMode='numeric';inp.pattern='[0-9]*';inp.value=scv||'';inp.placeholder='\u2014';inp.id='prelim-inp-'+i;

    inp.oninput=function(pidC,iC){return function(e){
      var v=parseInt(e.target.value)||0;
      S.prelimScores[pidC]=v;
      delete S.prelimHoled[pidC];
      // Update par label inline
      var le=document.getElementById('prelim-lbl-'+iC);
      if(le){var nl=parLabel(v,FIRST_HOLE);le.className=nl?nl.cls:'';le.textContent=nl?nl.text:'';}

      if(v>=1&&v<=15){

        if(ni){ni.focus();ni.select();}
      }

      if(!scoreGroups[sc])scoreGroups[sc]=[];

      hasTies=true;
      var ranked=group.filter(function(p){return S.prelimHoled[p.id];});
      if(ranked.length<group.length)allTiesResolved=false;

      // Show tie resolution box
      var tieBox=document.createElement('div');
      tieBox.style.cssText='background:var(--am2);border:1.5px solid var(--am3);border-radius:var(--r2);padding:12px 14px;margin-bottom:12px;';
      var tieTitle=document.createElement('p');
      tieTitle.style.cssText='font-size:13px;font-weight:700;color:var(--am);margin-bottom:10px;';
      tieTitle.textContent='\u26A0\uFE0F Tied at '+sc+' \u2014 tap in order of who holed out first:';
      tieBox.appendChild(tieTitle);
      var btnRow=document.createElement('div');btnRow.style.cssText='display:flex;gap:8px;flex-wrap:wrap;';
      group.forEach(function(p){
        var isRanked=!!S.prelimHoled[p.id];
        var rankPos=Object.keys(S.prelimHoled).sort(function(a,b){return S.prelimHoled[a]-S.prelimHoled[b];}).indexOf(String(p.id));
        var tb=document.createElement('button');
        tb.style.cssText='height:38px;padding:0 16px;border-radius:20px;font-size:14px;font-weight:700;cursor:pointer;'
          +'border:1.5px solid '+(isRanked?'var(--gr)':'var(--am3)')+';'
          +'background:'+(isRanked?'var(--gr)':'transparent')+';'
          +'color:'+(isRanked?'#fff':'var(--am)')+';'
          +'display:flex;align-items:center;gap:6px;';
        if(isRanked){
          tb.innerHTML='<span style="background:rgba(255,255,255,0.3);border-radius:50%;width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;">'+(rankPos+1)+'</span>'+p.name;
        } else {
          tb.textContent=p.name;
        }
        tb.onclick=function(pid2){return function(){
          if(S.prelimHoled[pid2]){
            var myTime=S.prelimHoled[pid2];
            group.forEach(function(gp){if(S.prelimHoled[gp.id]&&S.prelimHoled[gp.id]>=myTime)delete S.prelimHoled[gp.id];});
          } else {
            S.prelimHoled[pid2]=Date.now();
          }
          render();
        };}(p.id);
        btnRow.appendChild(tb);
      });
      tieBox.appendChild(btnRow);
      if(ranked.length>0){
        var summary=document.createElement('p');
        summary.style.cssText='font-size:11px;color:var(--am);margin-top:8px;font-weight:700;';
        var orderedR=ranked.slice().sort(function(a,b){return S.prelimHoled[a.id]-S.prelimHoled[b.id];});
        summary.textContent='Holed order: '+orderedR.map(function(p,i){return (i+1)+'. '+p.name;}).join(' \u00B7 ');
        tieBox.appendChild(summary);
      }
      app.appendChild(tieBox);
    });

    // Wolf order preview
    var sorted2=[].concat(S.players).sort(function(a,b){
      var sa=S.prelimScores[a.id]||99,sb2=S.prelimScores[b.id]||99;
      if(sa!==sb2)return sa-sb2;
      return(S.prelimHoled[a.id]||99999999)-(S.prelimHoled[b.id]||99999999);
    });
    var orderBox=document.createElement('div');
    orderBox.style.cssText='background:var(--bg0);border:0.5px solid var(--bdr);border-radius:var(--r2);padding:10px 14px;margin-bottom:12px;';
    var orderLbl=document.createElement('p');orderLbl.className='section-title';orderLbl.style.marginBottom='8px';
    orderLbl.textContent='Wolf order (hole '+(FIRST_HOLE+1)+' onwards)';orderBox.appendChild(orderLbl);
    var orderRow=document.createElement('div');orderRow.style.cssText='display:flex;align-items:center;gap:6px;flex-wrap:wrap;';
    sorted2.forEach(function(p,idx){
      var pI=S.players.indexOf(p);
      var chip=document.createElement('span');chip.style.cssText='display:flex;align-items:center;gap:4px;font-size:13px;font-weight:700;';
      chip.appendChild(mkAv(p.name,pI,22));
      var nm=document.createElement('span');nm.textContent=p.name;chip.appendChild(nm);
      orderRow.appendChild(chip);
      if(idx<sorted2.length-1){var sep=document.createElement('span');sep.style.cssText='color:var(--tx2);font-size:16px;';sep.textContent='\u203A';orderRow.appendChild(sep);}
    });
    orderBox.appendChild(orderRow);app.appendChild(orderBox);

    if(hasTies&&!allTiesResolved){
      var hint=document.createElement('p');
      hint.style.cssText='font-size:12px;color:var(--am);text-align:center;margin-bottom:8px;font-weight:700;';
      hint.textContent='Tap tied players above in order of who holed out first';
      app.appendChild(hint);
    }
    var btn=document.createElement('button');btn.className='btn-confirm';btn.id='prelim-start-btn';
    btn.textContent='Set wolf order & start';
    btn.disabled=hasTies&&!allTiesResolved;
    btn.onclick=function(){
      S.wolfOrder=sorted2.map(function(p){return p.id;});
      S.holes[FIRST_HOLE]={scores:Object.assign({},S.prelimScores),mode:'prelim'};
      S.currentHole=FIRST_HOLE+1;S.screen='game';render();
    };
    app.appendChild(btn);
  } else {
    var btn2=document.createElement('button');btn2.className='btn-confirm';btn2.id='prelim-start-btn';
    btn2.textContent='Set wolf order & start';btn2.disabled=true;app.appendChild(btn2);
  }
  renderFooter(app);
}

// ── GAME ──────────────────────────────────────────────────────────────────────
function renderGame(app){
  recalcHoleResult(S.currentHole);
  var wolfId=wolfFor(S.currentHole);
  var wolfP=pById(wolfId);
  var hole=S.holes[S.currentHole]||{};
  var is5=S.players.length===5;
  var dp=derivePoints();var pts=dp.pts;var birdies=dp.birdies;
  var forcedDone=deriveForcedWolf();
  var isConfirmed=!!hole.confirmed;

  // Nav — in gradient header (appended to shell app, not content div)
  var gameHdrEl=document.createElement('div');gameHdrEl.className='hole-nav-hdr';
  var nav=document.createElement('div');nav.className='hole-nav';
  var prev=document.createElement('button');prev.className='btn-nav';prev.textContent='\u2039';
  prev.onclick=function(){if(S.currentHole<=FIRST_HOLE+1){S.screen='prelim';render();}else{S.currentHole--;render();}};
  var tDiv=document.createElement('div');tDiv.className='hole-title';
  var confSpan=isConfirmed?' \u00B7 <span style="color:rgba(255,255,255,0.7);font-size:11px">\u2713 done</span>':'';
  tDiv.innerHTML='<h2>Hole '+S.currentHole+'</h2><p>Par '+PARS[S.currentHole]+' \u00B7 '+(S.course?S.course.name:'Los Lagos')+confSpan+'</p>';
  var maxConf=Math.max.apply(null,[FIRST_HOLE].concat(Object.keys(S.holes).filter(function(h){return S.holes[h].confirmed;}).map(Number)));
  var nxt=document.createElement('button');nxt.className='btn-nav';nxt.textContent='\u203A';
  nxt.disabled=S.currentHole>=LAST_HOLE||(S.currentHole>maxConf&&!isConfirmed);
  nxt.onclick=function(){S.currentHole++;render();};
  nav.appendChild(prev);nav.appendChild(tDiv);nav.appendChild(nxt);
  gameHdrEl.appendChild(nav);
  // Insert before the app-content div (which is the last child of the shell)
  var shell=document.getElementById('app');
  shell.insertBefore(gameHdrEl,appContent);

  // Wolf pill card
  if(wolfP){
    var wr=document.createElement('div');wr.className='wolf-pill';
    // Avatar
    var pI2=pIdx(wolfId);
    var wAv=mkAv(wolfP.name,pI2,36);wAv.style.flexShrink='0';wr.appendChild(wAv);
    // Info
    var wInfo=document.createElement('div');wInfo.className='wolf-pill-info';
    var wLbl=document.createElement('div');wLbl.className='wolf-pill-label';wLbl.textContent='\uD83D\uDC3A Wolf';
    var wName=document.createElement('div');wName.className='wolf-pill-name';
    var wb=document.createElement('span');wb.textContent=wolfP.name;
    var mb=document.createElement('button');
    mb.className='btn-mulligan'+(S.mulliganUsed[wolfId]?' used':'');
    mb.textContent=S.mulliganUsed[wolfId]?'Mulligan used':'Use mulligan';
    mb.onclick=function(){if(!S.mulliganUsed[wolfId]){S.mulliganUsed[wolfId]=true;render();}};
    wName.appendChild(wb);wInfo.appendChild(wLbl);wInfo.appendChild(wName);
    wr.appendChild(wInfo);wr.appendChild(mb);app.appendChild(wr);
  }

  // Wolf decision
  if(wolfP){
    var forced=!is5&&mustBeForced(S.currentHole);
    if(forced&&hole.mode!=='forced'&&!hole.confirmed){
      if(!S.holes[S.currentHole])S.holes[S.currentHole]={};
      S.holes[S.currentHole].mode='forced';
      delete S.holes[S.currentHole].partner;
      hole=S.holes[S.currentHole];
    }
    var holeMode=hole.mode||'';
    var needsDecision=!holeMode;

    var decWrap=document.createElement('div');
    if(needsDecision){
      decWrap.style.cssText='border:2px solid var(--bl);border-radius:14px;padding:12px;margin-bottom:12px;background:var(--bl2);';
    } else {
      decWrap.style.cssText='margin-bottom:0;';
    }

    var stepRow=document.createElement('div');stepRow.style.cssText='display:flex;align-items:center;gap:8px;margin-bottom:8px;';
    var badge=document.createElement('div');
    badge.style.cssText='width:22px;height:22px;border-radius:50%;background:'+(needsDecision?'var(--bl)':'var(--tx2)')+';color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;';
    badge.textContent='1';
    var decLbl=document.createElement('p');decLbl.className='section-title';decLbl.style.margin='0';
    if(forced){
      decLbl.innerHTML='Wolf decision <span style="font-size:10px;background:#d4860e;color:#fff;padding:2px 8px;border-radius:10px;margin-left:4px;font-weight:700;">Forced Wolf required</span>';
    } else if(needsDecision){
      decLbl.innerHTML='Wolf decision <span style="font-size:10px;color:var(--bl);font-weight:700;margin-left:4px;">\u2190 make your choice</span>';
    } else {
      decLbl.textContent='Wolf decision';
    }
    stepRow.appendChild(badge);stepRow.appendChild(decLbl);
    decWrap.appendChild(stepRow);

    var pills=document.createElement('div');pills.className='mode-pills';
    var modes=is5?['partner','lone']:['partner','lone','forced'];
    var modeLabels={partner:'Choose partner',lone:'Lone Wolf',forced:'Forced Wolf'};
    modes.forEach(function(m){
      var btn=document.createElement('button');btn.className='mode-pill'+(holeMode===m?' active':'');
      btn.textContent=modeLabels[m];
      if(forced&&m!=='forced'){btn.disabled=true;btn.style.opacity='0.35';btn.style.cursor='not-allowed';}
      else {
        btn.onclick=function(){
          if(!S.holes[S.currentHole])S.holes[S.currentHole]={};
          S.holes[S.currentHole].mode=m;
          S.holes[S.currentHole].confirmed=false;
          S.holes[S.currentHole].manualOverride=false;
          S.holes[S.currentHole].winner=null;
          if(m!=='partner')delete S.holes[S.currentHole].partner;
          render();
        };
      }
      pills.appendChild(btn);
    });
    decWrap.appendChild(pills);
    app.appendChild(decWrap);

    if(hole.mode==='partner'){
      var pl=document.createElement('p');pl.className='section-title';pl.textContent='Select partner';app.appendChild(pl);
      var grid=document.createElement('div');grid.className='partner-grid';
      S.players.forEach(function(p){
        if(sid(p.id)===sid(wolfId))return;
        var pb=document.createElement('button');pb.className='btn-partner'+(sid(hole.partner)===sid(p.id)?' selected':'');
        pb.textContent=p.name;
        pb.onclick=function(){
          S.holes[S.currentHole].partner=p.id;
          S.holes[S.currentHole].confirmed=false;
          S.holes[S.currentHole].manualOverride=false;
          S.holes[S.currentHole].winner=null;
          render();
        };
        grid.appendChild(pb);
      });
      app.appendChild(grid);
    }
  }

  // Score card
  var sl=document.createElement('p');sl.className='section-title';sl.style.marginTop='4px';sl.textContent='Hole score (par '+PARS[S.currentHole]+')';app.appendChild(sl);
  var sc=document.createElement('div');sc.className='card';

  // Header row
  var hdrRow=document.createElement('div');
  hdrRow.style.cssText='display:flex;align-items:center;padding:0 0 8px;border-bottom:0.5px solid var(--bdr);margin-bottom:8px;gap:6px;';
  function colHdr(txt,w){var s=document.createElement('span');s.style.cssText='font-size:11px;font-weight:700;color:var(--tx2);text-transform:uppercase;letter-spacing:0.7px;'+(w?'width:'+w+'px;text-align:center;':'flex:1;');s.textContent=txt;return s;}
  hdrRow.appendChild(colHdr('Player',''));
  hdrRow.appendChild(colHdr('Score',54));
  hdrRow.appendChild(colHdr('Par',54));
  hdrRow.appendChild(colHdr('Result',68));
  sc.appendChild(hdrRow);

  // Read hole state again after recalc
  hole=S.holes[S.currentHole]||{};

  S.players.forEach(function(p,i){
    var row=document.createElement('div');row.style.cssText='display:flex;align-items:center;gap:6px;margin-bottom:'+(i===S.players.length-1?'0':'10px')+';';
    var chip=document.createElement('div');chip.style.cssText='display:flex;align-items:center;gap:8px;flex:1;min-width:0;';
    chip.appendChild(mkAv(p.name,i,30));
    var nameCol=document.createElement('div');nameCol.style.cssText='display:flex;flex-direction:column;gap:2px;min-width:0;';
    var nameTagRow=document.createElement('div');nameTagRow.style.cssText='display:flex;align-items:center;gap:4px;flex-wrap:wrap;';
    var ns=document.createElement('span');ns.style.cssText='font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;';ns.textContent=p.name;
    nameTagRow.appendChild(ns);
    if(sid(p.id)===sid(wolfId)){var t=document.createElement('span');t.className='role-tag role-wolf';t.textContent='Wolf';nameTagRow.appendChild(t);}
    else if(hole.mode==='partner'&&sid(p.id)===sid(hole.partner)){var t2=document.createElement('span');t2.className='role-tag role-cowolf';t2.textContent='Co-Wolf';nameTagRow.appendChild(t2);}
    nameCol.appendChild(nameTagRow);
    if(S.mulliganUsed&&S.mulliganUsed[p.id]){
      var mulRow=document.createElement('div');
      mulRow.innerHTML='<span style="font-size:10px;background:var(--rd2);border:1px solid var(--rd3);color:var(--rd);padding:1px 6px;border-radius:8px;font-weight:700;"><span style="text-decoration:line-through;">M</span> Mulligan used</span>';
      nameCol.appendChild(mulRow);
    }
    chip.appendChild(nameCol);

    var scv=(hole.scores||{})[p.id]||0;
    var inp=document.createElement('input');inp.className='score-input';inp.type='number';inp.min=1;inp.max=15;
    inp.inputMode='numeric';inp.pattern='[0-9]*';inp.value=scv||'';inp.placeholder='\u2014';
    inp.id='score-inp-'+i;
    inp.oninput=function(e){
      var val=parseInt(e.target.value)||0;
      if(!S.holes[S.currentHole])S.holes[S.currentHole]={};
      if(!S.holes[S.currentHole].scores)S.holes[S.currentHole].scores={};
      S.holes[S.currentHole].scores[p.id]=val;
      S.holes[S.currentHole].confirmed=false;
      S.holes[S.currentHole].manualOverride=false;
      S.holes[S.currentHole].winner=null;
      recalcHoleResult(S.currentHole);
      var hNow2=S.holes[S.currentHole]||{};
      // Update par label
      var lblEl2=document.getElementById('score-lbl-'+i);
      if(lblEl2){var nl=parLabel(val,S.currentHole);lblEl2.innerHTML=nl?'<span class="'+nl.cls+'">'+nl.text+'</span>':'';}
      // Update all result badges
      S.players.forEach(function(p2,i2){
        var re=document.getElementById('hole-res-'+i2);
        if(!re)return;re.innerHTML='';
        var pr=playerHoleResultFor(p2.id,S.currentHole);
        if(pr){var rb=document.createElement('span');rb.style.cssText=badgeStyle(pr.cls);rb.textContent=pr.text;re.appendChild(rb);}
      });
      // Update confirm btn
      var cb=document.getElementById('confirm-btn');
      if(cb){var hh=S.holes[S.currentHole]||{};cb.disabled=!(hh.mode&&(hh.winner==='tie'||hh.winner)&&(hh.mode!=='partner'||hh.partner));}
      // Auto advance
      if(val>=1&&val<=15){var ni=document.getElementById('score-inp-'+(i+1));if(ni){ni.focus();ni.select();}}
    };

    var lblWrap=document.createElement('div');lblWrap.id='score-lbl-'+i;lblWrap.style.cssText='width:54px;display:flex;align-items:center;justify-content:center;';
    var lbl3=parLabel(scv,S.currentHole);
    if(lbl3){var lt=document.createElement('span');lt.className=lbl3.cls;lt.textContent=lbl3.text;lblWrap.appendChild(lt);}
    if(S.currentHole===LAST_HOLE&&isBirdie(scv,LAST_HOLE)&&birdies[p.id]){var bb=document.createElement('span');bb.className='birdie-tag';bb.textContent='Bonus!';lblWrap.appendChild(bb);}

    var resWrap=document.createElement('div');resWrap.id='hole-res-'+i;resWrap.style.cssText='width:68px;display:flex;align-items:center;justify-content:center;';
    var pr2=playerHoleResultFor(p.id,S.currentHole);
    if(pr2){var rb2=document.createElement('span');rb2.style.cssText=badgeStyle(pr2.cls);rb2.textContent=pr2.text;resWrap.appendChild(rb2);}

    row.appendChild(chip);row.appendChild(inp);row.appendChild(lblWrap);row.appendChild(resWrap);
    sc.appendChild(row);
  });
  app.appendChild(sc);

  // Override pills
  hole=S.holes[S.currentHole]||{};
  if(hole.mode){
    var ovRow=document.createElement('div');ovRow.style.cssText='display:flex;align-items:center;gap:6px;margin-bottom:10px;flex-wrap:wrap;';
    var ovLbl=document.createElement('span');ovLbl.style.cssText='font-size:11px;font-weight:700;color:var(--tx2);text-transform:uppercase;letter-spacing:0.7px;margin-right:2px;';ovLbl.textContent='Override:';
    ovRow.appendChild(ovLbl);
    var overrides=[];
    if(hole.mode==='partner'&&hole.partner){
      overrides.push({label:'Team Wolf',val:'wolf_team'});
      overrides.push({label:'Other Guys',val:'others'});
    } else if(hole.mode==='lone'||hole.mode==='forced'){
      overrides.push({label:'Team Wolf',val:'wolf'});
      overrides.push({label:'Other Guys',val:'others'});
    }
    overrides.push({label:'Tie / No Blood',val:'tie'});
    overrides.forEach(function(o){
      var ob=document.createElement('button');
      ob.dataset.overrideVal=o.val;
      var isActive=hole.winner===o.val;
      ob.style.cssText='height:30px;padding:0 10px;border-radius:20px;font-size:12px;font-weight:700;font-family:inherit;cursor:pointer;border:1.5px solid '+(isActive?'var(--bl)':'var(--bdm)')+';background:'+(isActive?'var(--bl)':'transparent')+';color:'+(isActive?'#fff':'var(--tx1)')+';';
      ob.textContent=o.label;
      ob.onclick=function(){
        S.holes[S.currentHole].winner=o.val;
        S.holes[S.currentHole].manualOverride=true;
        S.holes[S.currentHole].overrideScoreHash=JSON.stringify(S.holes[S.currentHole].scores||{});
        S.holes[S.currentHole].confirmed=false;
        render();
      };
      ovRow.appendChild(ob);
    });
    app.appendChild(ovRow);
  }

  // Confirm button
  hole=S.holes[S.currentHole]||{};
  var canConfirm=hole.mode&&(hole.winner==='tie'||hole.winner)&&(hole.mode!=='partner'||hole.partner);
  var cb2=document.createElement('button');cb2.className='btn-confirm';cb2.id='confirm-btn';
  if(hole.confirmed){cb2.textContent=S.currentHole===LAST_HOLE?'\u2713 Done \u2014 view results':'\u2713 Confirmed \u2014 next hole \u203A';cb2.style.background='var(--gr)';}
  else{cb2.textContent=S.currentHole===LAST_HOLE?'Finish game':'Confirm hole';}
  cb2.disabled=!canConfirm;
  cb2.onclick=function(){
    S.holes[S.currentHole].confirmed=true;
    if(S.currentHole===LAST_HOLE){
      var dp2=derivePoints();
      saveRound({date:new Date().toISOString(),players:S.players.map(function(p){return{name:p.name,color:p.color,id:String(p.id)};}),pts:Object.assign({},dp2.pts),holes:JSON.parse(JSON.stringify(S.holes)),wolfOrder:[].concat(S.wolfOrder),course:(S.course?S.course.name:''),firstHole:FIRST_HOLE,lastHole:LAST_HOLE});
      S.screen='results';
    } else {S.currentHole++;}
    render();
  };
  app.appendChild(cb2);
  renderScoreboard(app,pts,forcedDone);
  renderFooter(app);
}

// ── SCOREBOARD ────────────────────────────────────────────────────────────────
function renderScoreboard(app,pts,forcedDone){
  if(!pts){var dp3=derivePoints();pts=dp3.pts;forcedDone=deriveForcedWolf();}
  var lbl=document.createElement('p');lbl.className='section-title';lbl.textContent='Scoreboard';app.appendChild(lbl);
  var card=document.createElement('div');card.className='card-flush';
  var tbl=document.createElement('table');tbl.className='sb-table';
  tbl.innerHTML='<thead><tr><th style="width:36px">#</th><th>Player</th><th style="width:60px;text-align:right">Pts</th></tr></thead>';
  var tbody=document.createElement('tbody');
  var sorted=[].concat(S.players).sort(function(a,b){return (pts[b.id]||0)-(pts[a.id]||0);});
  var topPts=pts[sorted[0].id]||0;
  sorted.forEach(function(p,rank){
    var idx=pIdx(p.id);
    var tr=document.createElement('tr');
    if(rank===0&&topPts>0)tr.style.background='var(--gr2)';
    var avHtml='<div style="width:26px;height:26px;border-radius:50%;background:'+p.color+';color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;">'+(p.name||'').charAt(0).toUpperCase()+'</div>';
    var nf=S.players.length===4&&!forcedDone[p.id]&&S.screen==='game';
    var forcedTag=nf?'<span style="font-size:10px;background:var(--am3);color:#fff;padding:2px 6px;border-radius:10px;margin-left:4px;font-weight:700;">Forced pending</span>':'';
    tr.innerHTML='<td style="font-weight:700;color:var(--tx1)">'+(rank+1)+'</td><td><div style="display:flex;align-items:center;gap:8px">'+avHtml+'<div>'+p.name+forcedTag+'</div></div></td><td class="sb-pts">'+(pts[p.id]||0)+'</td>';
    tbody.appendChild(tr);
  });
  tbl.appendChild(tbody);card.appendChild(tbl);app.appendChild(card);
}

// ── RESULTS ───────────────────────────────────────────────────────────────────
function renderResults(app){
  var dp4=derivePoints();var pts=dp4.pts;var birdies=dp4.birdies;
  var sorted=[].concat(S.players).sort(function(a,b){return (pts[b.id]||0)-(pts[a.id]||0);});
  var winner=sorted[0];
  var topPts=pts[winner.id]||0;

  var backRow=document.createElement('div');backRow.style.marginBottom='12px';

  thToggle.style.cssText='width:52px;height:30px;border-radius:15px;border:none;cursor:pointer;position:relative;background:'+(isDark?'var(--bl)':'var(--bdm)')+';';
  thToggle.innerHTML='<span style="position:absolute;top:3px;'+(isDark?'right:3px;':'left:3px;')+'width:24px;height:24px;border-radius:50%;background:#fff;"></span>';
  thToggle.onclick=function(){
    var cur=document.documentElement.getAttribute('data-theme')||'light';
    applyTheme(cur==='dark'?'light':'dark');
    render();
  };
  thRow.appendChild(thText);thRow.appendChild(thToggle);thCard.appendChild(thRow);app.appendChild(thCard);

  // Logo
  var logoLbl=document.createElement('p');logoLbl.className='section-title';logoLbl.textContent='Logo';app.appendChild(logoLbl);
  var logoCard=document.createElement('div');logoCard.className='card';
  var logoRow=document.createElement('div');logoRow.style.cssText='display:flex;align-items:center;gap:12px;';
  if(S.customLogo){var lPrev=document.createElement('img');lPrev.src=S.customLogo;lPrev.style.cssText='width:48px;height:48px;border-radius:8px;object-fit:contain;';logoRow.appendChild(lPrev);}
  var logoFi=document.createElement('input');logoFi.type='file';logoFi.accept='image/*';logoFi.style.display='none';
  logoFi.onchange=function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(ev){S.customLogo=ev.target.result;saveLogo(S.customLogo);render();};r.readAsDataURL(f);};
  var upBtn=document.createElement('button');upBtn.style.cssText='height:36px;padding:0 14px;background:var(--bl);color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;';
  upBtn.textContent=S.customLogo?'Change logo':'Upload logo';upBtn.onclick=function(){logoFi.click();};
  logoRow.appendChild(logoFi);logoRow.appendChild(upBtn);
  if(S.customLogo){var clrBtn2=document.createElement('button');clrBtn2.style.cssText='height:36px;padding:0 12px;background:transparent;border:1px solid var(--rd3);color:var(--rd);border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;';clrBtn2.textContent='Remove';clrBtn2.onclick=function(){S.customLogo=null;saveLogo(null);render();};logoRow.appendChild(clrBtn2);}
  logoCard.appendChild(logoRow);app.appendChild(logoCard);

  // Reset round
  var rstLbl=document.createElement('p');rstLbl.className='section-title';rstLbl.textContent='Current round';app.appendChild(rstLbl);
  var rstCard=document.createElement('div');rstCard.className='card';
  var rstRow=document.createElement('div');rstRow.style.cssText='display:flex;align-items:center;justify-content:space-between;';
  var rstText=document.createElement('div');
  rstText.innerHTML='<div style="font-size:15px;font-weight:700;">Reset round</div><div style="font-size:12px;color:var(--tx2);margin-top:2px;">Clear current game and start over</div>';
  var rstBtn=document.createElement('button');rstBtn.style.cssText='height:36px;padding:0 16px;background:var(--rd);color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;';
  rstBtn.textContent='Reset';rstBtn.onclick=function(){doReset();};
  rstRow.appendChild(rstText);rstRow.appendChild(rstBtn);rstCard.appendChild(rstRow);app.appendChild(rstCard);

  // Saved players
  var spLbl=document.createElement('p');spLbl.className='section-title';spLbl.textContent='Saved players';app.appendChild(spLbl);
  var spCard=document.createElement('div');spCard.className='card-flush';
  var rstr=loadRoster();var profiles5=loadProfiles();
  if(rstr.length===0){
    var em=document.createElement('div');em.style.cssText='padding:14px;color:var(--tx2);font-size:14px;text-align:center;';em.textContent='No saved players';spCard.appendChild(em);
  } else {
    rstr.forEach(function(name,ri2){
      var prof5=profiles5[name]||{};
      var r=document.createElement('div');r.style.cssText='border-bottom:'+(ri2<rstr.length-1?'0.5px solid var(--bdr)':'none')+';';

      // Top row: avatar + name + edit btn + delete btn
      var topRow2=document.createElement('div');topRow2.style.cssText='display:flex;align-items:center;padding:10px 14px;gap:10px;';

      // Avatar — shows photo if saved
      var av2=document.createElement('div');
      av2.style.cssText='width:38px;height:38px;border-radius:50%;background:'+(prof5.color||PCOLS[ri2%PCOLS.length])+';color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0;overflow:hidden;cursor:pointer;position:relative;';
      if(prof5.photo){var pImg=document.createElement('img');pImg.src=prof5.photo;pImg.style.cssText='width:100%;height:100%;object-fit:cover;';av2.appendChild(pImg);}
      else{av2.textContent=(name||'').charAt(0).toUpperCase();}

      var ns2=document.createElement('span');ns2.style.cssText='font-size:15px;font-weight:700;flex:1;';ns2.textContent=name;

      // Chevron indicator
      var chevron=document.createElement('span');
      chevron.style.cssText='font-size:14px;color:var(--tx2);transition:transform 0.2s;flex-shrink:0;';
      chevron.textContent='\u203A';

      var db2=document.createElement('button');db2.style.cssText='background:none;border:none;color:var(--rd3);font-size:18px;cursor:pointer;font-weight:700;padding:0 2px;flex-shrink:0;';db2.textContent='\u00D7';
      db2.onclick=function(n){return function(e){e.stopPropagation();removeFromRoster(n);render();};}(name);

      topRow2.style.cursor='pointer';
      topRow2.appendChild(av2);topRow2.appendChild(ns2);topRow2.appendChild(chevron);topRow2.appendChild(db2);
      r.appendChild(topRow2);

      // Edit panel — color swatches + photo upload
      var ep2=document.createElement('div');ep2.id='sp-edit-'+ri2;ep2.style.cssText='display:none;flex-direction:column;gap:10px;padding:0 14px 14px;';

      // Name field
      var nLbl=document.createElement('p');nLbl.style.cssText='font-size:11px;font-weight:700;color:var(--tx2);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px;';nLbl.textContent='Name';
      var nRow=document.createElement('div');nRow.style.cssText='display:flex;gap:8px;';
      var nInp=document.createElement('input');nInp.type='text';nInp.value=name;
      nInp.style.cssText='flex:1;height:36px;padding:0 10px;border:0.5px solid var(--bdm);border-radius:var(--r1);font-size:15px;font-weight:700;background:var(--bg0);color:var(--tx0);outline:none;';
      var nSaveBtn=document.createElement('button');
      nSaveBtn.style.cssText='height:36px;padding:0 14px;background:var(--bl);color:#fff;border:none;border-radius:var(--r1);font-size:13px;font-weight:700;cursor:pointer;';
      nSaveBtn.textContent='Save';
      nSaveBtn.onclick=function(oldName,inp2){return function(){
        var newName=inp2.value.trim();
        if(!newName||newName===oldName)return;
        // Rename in roster
        var idx=roster.indexOf(oldName);
        if(idx>=0)roster[idx]=newName;
        saveRoster(roster);
        // Move profile to new name key
        var profs=loadProfiles();
        if(profs[oldName]){profs[newName]=profs[oldName];delete profs[oldName];}
        try{localStorage.setItem('wolf_profiles',JSON.stringify(profs));}catch(e){}
        // Update any current players with this name
        S.players.forEach(function(p){if(p.name===oldName)p.name=newName;});
        showToast('\u2713 Renamed to '+newName);
        render();
      };}(name,nInp);
      nRow.appendChild(nInp);nRow.appendChild(nSaveBtn);
      ep2.appendChild(nLbl);ep2.appendChild(nRow);

      // Color presets
      var cLbl=document.createElement('p');cLbl.style.cssText='font-size:11px;font-weight:700;color:var(--tx2);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px;margin-top:4px;';cLbl.textContent='Color';
      var swRow=document.createElement('div');swRow.style.cssText='display:flex;gap:6px;flex-wrap:wrap;';
      var presets=['#1354A0','#2d5e0a','#8f1f1f','#7a3d00','#2e2880','#0f6e56','#993556','#444440','#c04000','#006080'];
      presets.forEach(function(col){
        var sw=document.createElement('div');
        sw.style.cssText='width:28px;height:28px;border-radius:50%;background:'+col+';cursor:pointer;border:2.5px solid '+((prof5.color===col)?'var(--tx0)':'transparent')+';flex-shrink:0;';
        sw.onclick=function(c2,n2){return function(){
          var profs=loadProfiles();if(!profs[n2])profs[n2]={};profs[n2].color=c2;
          try{localStorage.setItem('wolf_profiles',JSON.stringify(profs));}catch(e){}
          render();
        };}(col,name);
        swRow.appendChild(sw);
      });
      // Custom color picker
      var ci2=document.createElement('input');ci2.type='color';ci2.value=prof5.color||'#1354A0';
      ci2.style.cssText='width:36px;height:28px;border:none;border-radius:6px;cursor:pointer;';
      ci2.onchange=function(n2){return function(e){
        var profs=loadProfiles();if(!profs[n2])profs[n2]={};profs[n2].color=e.target.value;
        try{localStorage.setItem('wolf_profiles',JSON.stringify(profs));}catch(e2){}
        render();
      };}(name);
      swRow.appendChild(ci2);
      ep2.appendChild(cLbl);ep2.appendChild(swRow);

      // Photo upload
      var phLbl=document.createElement('p');phLbl.style.cssText='font-size:11px;font-weight:700;color:var(--tx2);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px;margin-top:2px;';phLbl.textContent='Photo';
      var phBtnRow=document.createElement('div');phBtnRow.style.cssText='display:flex;gap:8px;align-items:center;';
      // Show current photo preview if exists
      if(prof5.photo){
        var prevImg=document.createElement('img');prevImg.src=prof5.photo;prevImg.style.cssText='width:40px;height:40px;border-radius:50%;object-fit:cover;border:2px solid var(--bl);';
        phBtnRow.appendChild(prevImg);
      }
      var phFi=document.createElement('input');phFi.type='file';phFi.accept='image/*';phFi.style.display='none';
      phFi.onchange=function(n2,avEl){return function(e){
        var f=e.target.files[0];if(!f)return;
        var rdr=new FileReader();rdr.onload=function(ev){
          showCropModal(ev.target.result,function(cropped){
            var profs=loadProfiles();if(!profs[n2])profs[n2]={};profs[n2].photo=cropped;
            try{localStorage.setItem('wolf_profiles',JSON.stringify(profs));}catch(e2){}
            render();
          });
        };rdr.readAsDataURL(f);
      };}(name,av2);
      var upBtn2=document.createElement('button');upBtn2.style.cssText='height:32px;padding:0 12px;border:0.5px solid var(--bdm);border-radius:var(--r1);font-size:13px;font-weight:700;cursor:pointer;background:var(--bg1);color:var(--tx0);';
      upBtn2.textContent=prof5.photo?'Change photo':'Upload photo';upBtn2.onclick=function(){phFi.click();};
      phBtnRow.appendChild(phFi);phBtnRow.appendChild(upBtn2);
      if(prof5.photo){
        var rmPhBtn=document.createElement('button');rmPhBtn.style.cssText='height:32px;padding:0 10px;border:1px solid var(--rd3);border-radius:var(--r1);font-size:13px;font-weight:700;cursor:pointer;background:transparent;color:var(--rd);';
        rmPhBtn.textContent='Remove';rmPhBtn.onclick=function(n2){return function(){
          var profs=loadProfiles();if(profs[n2])profs[n2].photo=null;
          try{localStorage.setItem('wolf_profiles',JSON.stringify(profs));}catch(e2){}
          render();
        };}(name);
        phBtnRow.appendChild(rmPhBtn);
      }
      ep2.appendChild(phLbl);ep2.appendChild(phBtnRow);
      r.appendChild(ep2);

      // Toggle edit panel
      function toggleEdit(){
        var isOpen=ep2.style.display!=='none';
        document.querySelectorAll('[id^="sp-edit-"]').forEach(function(el){el.style.display='none';});
        document.querySelectorAll('.sp-chevron').forEach(function(el){el.style.transform='';});
        if(!isOpen){
          ep2.style.display='flex';
          chevron.style.transform='rotate(90deg)';
        }
      }
      topRow2.onclick=toggleEdit;
      chevron.className='sp-chevron';

      spCard.appendChild(r);
    });
  }
  app.appendChild(spCard);

  // Add new player manually
  var addPlLbl=document.createElement('p');addPlLbl.className='section-title';addPlLbl.style.marginTop='4px';addPlLbl.textContent='Add player';app.appendChild(addPlLbl);
  var addPlCard=document.createElement('div');addPlCard.className='card';
  var addNameRow=document.createElement('div');addNameRow.style.cssText='display:flex;gap:8px;margin-bottom:8px;';
  var addNameInp=document.createElement('input');addNameInp.type='text';addNameInp.placeholder='Player name';
  addNameInp.style.cssText='flex:1;height:40px;padding:0 12px;border:0.5px solid var(--bdm);border-radius:var(--r1);font-size:15px;font-weight:700;background:var(--bg1);color:var(--tx0);outline:none;';
  addNameRow.appendChild(addNameInp);
  addPlCard.appendChild(addNameRow);
  var addPlBtn=document.createElement('button');
  addPlBtn.style.cssText='width:100%;height:40px;background:var(--bl);color:#fff;border:none;border-radius:var(--r1);font-size:15px;font-weight:700;cursor:pointer;';
  addPlBtn.textContent='+ Save player';
  addPlBtn.onclick=function(){
    var n=addNameInp.value.trim();
    if(!n){addNameInp.style.borderColor='var(--rd3)';return;}
    addToRoster(n);
    showToast('\u2713 '+n+' saved');
    addNameInp.value='';
    render();
  };
  addPlCard.appendChild(addPlBtn);
  app.appendChild(addPlCard);

  // Version history
  var verLbl=document.createElement('p');verLbl.className='section-title';verLbl.style.marginTop='4px';verLbl.textContent='Version history';app.appendChild(verLbl);
  var verCard=document.createElement('div');verCard.className='card-flush';
  var versions=[
    {v:'v2.6.0',date:'Apr 2026',notes:'Full visual redesign: blue gradient header showing course and nine, wolf displayed in pill card with avatar, cards use shadow instead of hairline borders, settings and reset moved out of tab bar into header, circular delete buttons.'},
    {v:'v2.5.0',date:'Apr 2026',notes:'5-player Wolf rotation (first 5 holes by order, then merit-based). Wolf override tap. Los Lagos pars corrected (H17 par 3, H9 par 5). 338 courses in database including full CA, NV, AZ, UT. Live course search via Golf Course API. Front/back/all 18 selector.'},
    {v:'v2.4.0',date:'Apr 2026',notes:'Course search with 200+ built-in US courses. Dynamic hole range from course selection. Par labels update per course. Wolf order now merit-based (best scorer on prior hole).'},
    {v:'v2.3.0',date:'Apr 2026',notes:'Prelim tie detection with tap-to-rank UI. Auto-advance score inputs. Player photo crop modal. Saved players edit panel with color, photo, name rename. Add player form in Settings.'},
    {v:'v2.2.0',date:'Mar 2026',notes:'History share button. Remove from game button in saved players. Settlement text left-aligned in share. Medal emojis removed from share scores. Stroke totals added to share text.'},
    {v:'v2.1.0',date:'Mar 2026',notes:'Reset button in tab bar. Dark/light mode toggle. Custom app logo upload. iOS home screen icon generation. Dropdown arrow now tappable showing all saved players.'},
    {v:'v2.0.0',date:'Mar 2026',notes:'Full rewrite. Player profiles with color and photo. Crop modal for photos. Saved players with persistent profiles. Share Results via native share sheet. Round history with recap view.'},
    {v:'v1.0.0',date:'Feb 2026',notes:'Initial release. Back 9 Wolf scoring for Los Lagos. 4-player support. Wolf rotation, partner/lone/forced modes. Settlement calculation. Basic history.'}
  ];
  versions.forEach(function(ver,vi){
    var row=document.createElement('div');
    row.style.cssText='padding:10px 14px;'+(vi<versions.length-1?'border-bottom:0.5px solid var(--bdr);':'');
    var top=document.createElement('div');top.style.cssText='display:flex;align-items:center;gap:8px;margin-bottom:4px;';
    var badge=document.createElement('span');
    badge.style.cssText='font-size:12px;font-weight:700;background:var(--bl);color:#fff;padding:2px 8px;border-radius:10px;flex-shrink:0;';
    badge.textContent=ver.v;
    var date=document.createElement('span');date.style.cssText='font-size:12px;color:var(--tx2);font-weight:700;';date.textContent=ver.date;
    top.appendChild(badge);top.appendChild(date);
    var notes=document.createElement('p');notes.style.cssText='font-size:12px;color:var(--tx1);line-height:1.5;';notes.textContent=ver.notes;
    row.appendChild(top);row.appendChild(notes);
    verCard.appendChild(row);
  });
  app.appendChild(verCard);
}

function generateIcon(){
  try{
    var canvas=document.createElement('canvas');
    canvas.width=180;canvas.height=180;
    var ctx=canvas.getContext('2d');
    ctx.fillStyle='#1354A0';
    ctx.beginPath();
    if(ctx.roundRect)ctx.roundRect(0,0,180,180,36);
    else ctx.rect(0,0,180,180);
    ctx.fill();
    ctx.font='100px serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('\uD83D\uDC3A',90,95);
    var url=canvas.toDataURL('image/png');
    var a=document.getElementById('ati');var f=document.getElementById('fav');
    if(a)a.href=url;if(f)f.href=url;
    if(S.customLogo){
      var img2=new Image();
      img2.onload=function(){
        ctx.clearRect(0,0,180,180);
        ctx.fillStyle='#1354A0';ctx.beginPath();
        if(ctx.roundRect)ctx.roundRect(0,0,180,180,36);else ctx.rect(0,0,180,180);
        ctx.fill();ctx.drawImage(img2,20,20,140,140);
        var url2=canvas.toDataURL('image/png');
        if(a)a.href=url2;if(f)f.href=url2;
      };img2.src=S.customLogo;
    }
  }catch(e){}
}
render();
generateIcon();
</script>
</body>
</html>
